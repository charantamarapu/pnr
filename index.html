<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rail Journey Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    header {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .add-pnr-form {
      display: flex;
      gap: 8px;
    }

    .add-pnr-form input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-action { background: #374151; color: #fff; }
    .btn-action:hover { background: #4b5563; }
    .btn-refresh-all {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 0.95rem;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-refresh-all:hover {
      background: #1d4ed8;
    }

    .pnr-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pnr-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .pnr-card:hover {
      border-color: #374151;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
    }

    .route-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #93c5fd;
    }

    .pnr-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: #1f2937;
      padding: 2px 8px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .badge-cnf { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-wl { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-err { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .badge-idle { background: #1f2937; color: var(--text-muted); }

    .passenger-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 0.8rem;
    }

    .passenger-table th, .passenger-table td {
      border: 1px solid #1f2937;
      padding: 6px 10px;
      text-align: left;
    }

    .passenger-table th {
      background: #161e2e;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="top-bar">
      <h1>🚆 Trip PNR Dashboard</h1>
    </div>
  </header>

  <div class="controls-grid">
    <div class="add-pnr-form">
      <input type="text" id="routeInput" placeholder="Route (e.g. Pune - Mumbai)" style="flex: 1;" />
      <input type="text" id="pnrInput" placeholder="10-digit PNR" maxlength="10" style="width: 140px;" />
      <button class="btn btn-action" onclick="addNewPnr()">Add Leg</button>
    </div>
    <button class="btn btn-refresh-all" id="refreshBtn" onclick="refreshAllPnrs()">
      <span>🔄</span> Check All Status
    </button>
  </div>

  <div class="pnr-list" id="pnrContainer"></div>
</div>

<script>
  // Hardcoded Cloudflare Worker Endpoint
  const WORKER_URL = "https://pnr.charantamarapu.workers.dev";

  // Preloaded PNR numbers for your journey
  const defaultLegs = [
    { route: "Perambur → Nagpur", pnr: "4557771590" },
    { route: "Nagpur → Hazrat Nizamuddin", pnr: "4765547266" },
    { route: "Delhi → Haridwar", pnr: "2464062959" },
    { route: "Haridwar → Hardoi", pnr: "2164068679" },
    { route: "Hardoi → Ayodhya Cantt", pnr: "2264069667" },
    { route: "Lucknow → Prayagraj Sangam", pnr: "2164087805" },
    { route: "Prayagraj Rambag → Varanasi", pnr: "2626000292" },
    { route: "Varanasi → Gaya", pnr: "2526008378" },
    { route: "Gaya → Puri", pnr: "2526012364" },
    { route: "Puri → Vijayawada", pnr: "6210388881" },
    { route: "Vijayawada → MGR Chennai Central", pnr: "8754391787" }
  ];

  let tripLegs = JSON.parse(localStorage.getItem('trip_pnrs')) || defaultLegs;
  let statusCache = JSON.parse(localStorage.getItem('status_cache') || '{}');

  function saveLegs() {
    localStorage.setItem('trip_pnrs', JSON.stringify(tripLegs));
  }

  function addNewPnr() {
    const route = document.getElementById('routeInput').value.trim() || 'Train Journey';
    const pnr = document.getElementById('pnrInput').value.trim();

    if (pnr.length !== 10 || isNaN(pnr)) {
      alert('Please enter a valid 10-digit numeric PNR');
      return;
    }

    if (tripLegs.some(item => item.pnr === pnr)) {
      alert('This PNR is already added.');
      return;
    }

    tripLegs.push({ route, pnr });
    saveLegs();
    renderCards();
    document.getElementById('routeInput').value = '';
    document.getElementById('pnrInput').value = '';
  }

  function removeLeg(index) {
    if (confirm(`Remove leg "${tripLegs[index].route}"?`)) {
      delete statusCache[tripLegs[index].pnr];
      localStorage.setItem('status_cache', JSON.stringify(statusCache));
      tripLegs.splice(index, 1);
      saveLegs();
      renderCards();
    }
  }

  async function fetchPnr(pnr) {
    const res = await fetch(`${WORKER_URL}/?pnr=${pnr}`);
    if (!res.ok) {
      throw new Error(`HTTP Error ${res.status}`);
    }
    return await res.json();
  }

  async function refreshAllPnrs() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Refreshing all...';

    await Promise.all(tripLegs.map(async (leg) => {
      try {
        const data = await fetchPnr(leg.pnr);
        statusCache[leg.pnr] = { success: true, data, lastChecked: new Date().toLocaleTimeString() };
      } catch (err) {
        statusCache[leg.pnr] = { success: false, error: err.message, lastChecked: new Date().toLocaleTimeString() };
      }
    }));

    localStorage.setItem('status_cache', JSON.stringify(statusCache));
    btn.disabled = false;
    btn.innerHTML = '<span>🔄</span> Check All Status';
    renderCards();
  }

  function getBadge(status) {
    if (!status) return `<span class="status-badge badge-idle">Not Checked</span>`;
    const s = status.toUpperCase();
    if (s.includes('CNF') || s.includes('CONFIRM')) {
      return `<span class="status-badge badge-cnf">${status}</span>`;
    }
    if (s.includes('WL') || s.includes('RAC')) {
      return `<span class="status-badge badge-wl">${status}</span>`;
    }
    return `<span class="status-badge badge-idle">${status}</span>`;
  }

  function renderCards() {
    const container = document.getElementById('pnrContainer');
    if (tripLegs.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 40px;">No trips added.</p>`;
      return;
    }

    container.innerHTML = tripLegs.map((leg, idx) => {
      const cached = statusCache[leg.pnr];
      let bodyHtml = `<div style="color: var(--text-muted); font-size: 0.85rem;">Click "Check All Status" to inspect latest booking status.</div>`;

      if (cached) {
        if (!cached.success) {
          bodyHtml = `<div class="badge-err" style="padding: 8px; border-radius: 4px; font-size: 0.8rem;">Error: ${cached.error}</div>`;
        } else {
          const d = cached.data;
          const trainName = d.TrainName || d.trainName || 'Train';
          const trainNo = d.TrainNo || d.trainNumber || '';
          const doj = d.Doj || d.dateOfJourney || '';
          const chartPrepared = d.ChartPrepared ? 'Chart Prepared' : 'Chart Not Prepared';
          const passengers = d.PassengerStatus || d.passengers || [];

          bodyHtml = `
            <div class="details-row">
              <div><strong>${trainNo} - ${trainName}</strong></div>
              <div>📅 ${doj} | <span style="color: ${d.ChartPrepared ? 'var(--success)' : 'var(--warning)'}; font-weight: 500;">${chartPrepared}</span></div>
            </div>
            ${passengers.length > 0 ? `
              <table class="passenger-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Booking Status</th>
                    <th>Current Status</th>
                    <th>Coach / Berth</th>
                  </tr>
                </thead>
                <tbody>
                  ${passengers.map((p, pIdx) => `
                    <tr>
                      <td>P${pIdx + 1}</td>
                      <td>${p.BookingStatus || '-'}</td>
                      <td>${getBadge(p.CurrentStatus || p.BookingStatus)}</td>
                      <td>${p.Coach ? `${p.Coach} /${p.Berth || ''}` : '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}
          `;
        }
      }

      return `
        <div class="pnr-card">
          <div class="card-head">
            <span class="route-title">${idx + 1}. ${leg.route}</span>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="pnr-tag">${leg.pnr}</span>
              <button onclick="removeLeg(${idx})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.85rem;">✕</button>
            </div>
          </div>
          ${bodyHtml}
          <div class="card-footer">
            <span>Leg ${idx + 1} of ${tripLegs.length}</span>
            <span>${cached ? `Updated: ${cached.lastChecked}` : ''}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // Initial render
  renderCards();
</script>

</body>
</html>
