<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rail Journey Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --timing-blue: #60a5fa;
      --station-highlight: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    header {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .add-pnr-form {
      display: flex;
      gap: 8px;
    }

    .add-pnr-form input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-action { background: #374151; color: #fff; }
    .btn-action:hover { background: #4b5563; }
    .btn-refresh-all {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 0.95rem;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-refresh-all:hover {
      background: #1d4ed8;
    }

    .pnr-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pnr-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .pnr-card:hover {
      border-color: #374151;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
    }

    .route-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #93c5fd;
    }

    .pnr-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      background: #1f2937;
      padding: 2px 8px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
    }

    .timing-banner {
      background: rgba(31, 41, 55, 0.7);
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .timing-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .timing-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .timing-val {
      font-weight: 700;
      color: var(--timing-blue);
      font-size: 0.95rem;
    }

    .timing-date {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .station-display {
      font-size: 0.82rem;
      color: var(--station-highlight);
      font-weight: 500;
      line-height: 1.25;
    }

    .station-code-pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      background: #374151;
      padding: 1px 5px;
      border-radius: 3px;
      color: #93c5fd;
      margin-left: 3px;
    }

    .day-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      padding: 1px 4px;
      border-radius: 3px;
      margin-left: 4px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .badge-cnf { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-wl { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
    .badge-err { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .badge-idle { background: #1f2937; color: var(--text-muted); }

    .passenger-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 0.8rem;
    }

    .passenger-table th, .passenger-table td {
      border: 1px solid #1f2937;
      padding: 6px 10px;
      text-align: left;
    }

    .passenger-table th {
      background: #161e2e;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-check-single {
      background: #1f2937;
      color: #93c5fd;
      border: 1px solid #374151;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-check-single:hover:not(:disabled) {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .btn-check-single:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .spinning {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="top-bar">
      <h1>🚆 Trip PNR Dashboard</h1>
    </div>
  </header>

  <div class="controls-grid">
    <div class="add-pnr-form">
      <input type="text" id="routeInput" placeholder="Route (e.g. Pune - Mumbai)" style="flex: 1;" />
      <input type="text" id="pnrInput" placeholder="10-digit PNR" maxlength="10" style="width: 140px;" />
      <button class="btn btn-action" onclick="addNewPnr()">Add Leg</button>
      <button class="btn btn-action" onclick="addNewPnr(true)" style="background: #2563eb; color: #fff;" title="Add leg and check status immediately">Add & Check</button>
    </div>
    <button class="btn btn-refresh-all" id="refreshBtn" onclick="refreshAllPnrs()">
      <span>🔄</span> Check All Status
    </button>
  </div>

  <div class="pnr-list" id="pnrContainer"></div>
</div>

<script>
  const WORKER_URL = "https://pnr.charantamarapu.workers.dev";

  const STATION_NAMES = {
    "PER": "Perambur",
    "MAS": "MGR Chennai Central",
    "MS": "Chennai Egmore",
    "NGP": "Nagpur Junction",
    "NZM": "Hazrat Nizamuddin",
    "NDLS": "New Delhi",
    "DLI": "Old Delhi",
    "HW": "Haridwar Junction",
    "HRI": "Hardoi",
    "AYC": "Ayodhya Cantt",
    "AY": "Ayodhya Dham Jn",
    "LKO": "Lucknow Charbagh",
    "LJN": "Lucknow Jn NER",
    "PYGS": "Prayagraj Sangam",
    "PRG": "Prayag Junction",
    "PRYJ": "Prayagraj Junction",
    "PRRB": "Prayagraj Rambag",
    "BSB": "Varanasi Junction",
    "BCY": "Varanasi City",
    "GAYA": "Gaya Junction",
    "PURI": "Puri Terminus",
    "BZA": "Vijayawada Junction",
    "SMVB": "SMVT Bengaluru",
    "SBC": "KSR Bengaluru City",
    "DNR": "Danapur",
    "CNB": "Kanpur Central",
    "BPL": "Bhopal Junction"
  };

  const defaultLegs = [
    { route: "Perambur → Nagpur", pnr: "4557771590" },
    { route: "Nagpur → Hazrat Nizamuddin", pnr: "4765547266" },
    { route: "Delhi → Haridwar", pnr: "2464062959" },
    { route: "Haridwar → Hardoi", pnr: "2164068679" },
    { route: "Hardoi → Ayodhya Cantt", pnr: "2264069667" },
    { route: "Lucknow → Prayagraj Sangam", pnr: "2164087805" },
    { route: "Prayagraj Rambag → Varanasi", pnr: "2626000292" },
    { route: "Varanasi → Gaya", pnr: "2526008378" },
    { route: "Gaya → Puri", pnr: "2526012364" },
    { route: "Puri → Vijayawada", pnr: "6210388881" },
    { route: "Vijayawada → MGR Chennai Central", pnr: "8754391787" }
  ];

  let tripLegs = JSON.parse(localStorage.getItem('trip_pnrs')) || defaultLegs;
  let statusCache = JSON.parse(localStorage.getItem('status_cache') || '{}');

  function formatStation(code, apiName) {
    const cleanCode = (code || '').trim().toUpperCase();
    let name = (apiName || '').trim();

    if (!name || name.toUpperCase() === cleanCode) {
      name = STATION_NAMES[cleanCode] || cleanCode;
    }

    if (!cleanCode && !name) return 'N/A';
    if (!cleanCode) return name;
    if (name.toUpperCase() === cleanCode) return `<span class="station-code-pill">${cleanCode}</span>`;

    return `${name} <span class="station-code-pill">${cleanCode}</span>`;
  }

  function extractDate(data) {
    if (data.DateOfJourney) return data.DateOfJourney;
    if (data.Doj) return data.Doj;
    if (data.doj) return data.doj;
    if (data.JourneyDate) return data.JourneyDate;
    if (data.dateOfJourney) return data.dateOfJourney;
    if (data.DepartureDate) return data.DepartureDate;

    const rawDept = data.DepartureTime || data.sourceTime || '';
    if (rawDept.includes('T')) {
      const parts = rawDept.split('T')[0].split('-');
      if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return '';
  }

  function formatTime(val) {
    if (!val) return '--:--';
    if (val.includes('T')) {
      const timePart = val.split('T')[1];
      return timePart ? timePart.substring(0, 5) : '--:--';
    }
    return val;
  }

  // Calculates exact arrival date for overnight/multi-day runs
  function computeArrivalDate(startDateStr, departureTime, arrivalTime, dayCount) {
    if (!startDateStr) {
      return { date: '--', tag: null };
    }

    const parts = startDateStr.split(/[-/]/);
    if (parts.length !== 3) {
      return { date: startDateStr, tag: null };
    }

    let day, month, year;
    // Check if format is YYYY-MM-DD vs DD-MM-YYYY
    if (parts[0].length === 4) {
      year = parseInt(parts[0], 10);
      month = parseInt(parts[1], 10) - 1;
      day = parseInt(parts[2], 10);
    } else {
      day = parseInt(parts[0], 10);
      month = parseInt(parts[1], 10) - 1;
      year = parseInt(parts[2], 10);
      if (year < 100) year += 2000;
    }

    if (isNaN(day) || isNaN(month) || isNaN(year)) {
      return { date: startDateStr, tag: null };
    }

    const depDate = new Date(year, month, day);
    let addedDays = 0;

    if (dayCount && !isNaN(dayCount) && dayCount > 1) {
      addedDays = parseInt(dayCount, 10) - 1;
    } else if (departureTime && arrivalTime && departureTime !== '--:--' && arrivalTime !== '--:--') {
      const [depH, depM] = departureTime.split(':').map(Number);
      const [arrH, arrM] = arrivalTime.split(':').map(Number);
      if (!isNaN(depH) && !isNaN(arrH)) {
        if (arrH < depH || (arrH === depH && arrM < depM)) {
          addedDays = 1;
        }
      }
    }

    depDate.setDate(depDate.getDate() + addedDays);

    const d = String(depDate.getDate()).padStart(2, '0');
    const m = String(depDate.getMonth() + 1).padStart(2, '0');
    const y = depDate.getFullYear();
    const formatted = `${d}-${m}-${y}`;

    return {
      date: formatted,
      tag: addedDays > 0 ? `+${addedDays}d` : null
    };
  }

  const loadingPnrs = {};

  function saveLegs() {
    localStorage.setItem('trip_pnrs', JSON.stringify(tripLegs));
  }

  function addNewPnr(autoCheck = false) {
    const route = document.getElementById('routeInput').value.trim() || 'Train Journey';
    const pnr = document.getElementById('pnrInput').value.trim();

    if (pnr.length !== 10 || isNaN(pnr)) {
      alert('Please enter a valid 10-digit numeric PNR');
      return;
    }

    if (tripLegs.some(item => item.pnr === pnr)) {
      alert('This PNR is already added.');
      return;
    }

    tripLegs.push({ route, pnr });
    saveLegs();
    renderCards();
    document.getElementById('routeInput').value = '';
    document.getElementById('pnrInput').value = '';

    if (autoCheck) {
      refreshSinglePnr(tripLegs.length - 1);
    }
  }

  function removeLeg(index) {
    if (confirm(`Remove leg "${tripLegs[index].route}"?`)) {
      delete statusCache[tripLegs[index].pnr];
      localStorage.setItem('status_cache', JSON.stringify(statusCache));
      tripLegs.splice(index, 1);
      saveLegs();
      renderCards();
    }
  }

  async function fetchPnr(pnr) {
    const res = await fetch(`${WORKER_URL}/?pnr=${pnr}`);
    if (!res.ok) {
      throw new Error(`HTTP Error ${res.status}`);
    }
    const data = await res.json();

    // Catch worker or upstream error responses that return HTTP 200
    if (data.Error || data.error) {
      throw new Error(data.Error || data.error);
    }
    if (data.status === false && data.message) {
      throw new Error(data.message);
    }

    // Support nested payload if wrapped under data.data
    const trainData = (data.data && typeof data.data === 'object' && !Array.isArray(data.data)) ? data.data : data;

    // Verify minimum expected fields exist
    if (!trainData.TrainNo && !trainData.trainNumber && !trainData.TrainName && !trainData.trainName) {
      throw new Error('PNR status unavailable or expired.');
    }

    return trainData;
  }

  async function refreshSinglePnr(idx) {
    const leg = tripLegs[idx];
    if (!leg || loadingPnrs[leg.pnr]) return;

    loadingPnrs[leg.pnr] = true;
    renderCards();

    try {
      const data = await fetchPnr(leg.pnr);
      statusCache[leg.pnr] = { success: true, data, lastChecked: new Date().toLocaleTimeString() };
    } catch (err) {
      statusCache[leg.pnr] = { success: false, error: err.message, lastChecked: new Date().toLocaleTimeString() };
    } finally {
      delete loadingPnrs[leg.pnr];
      localStorage.setItem('status_cache', JSON.stringify(statusCache));
      renderCards();
    }
  }

  async function refreshAllPnrs() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Refreshing all...';

    tripLegs.forEach(leg => { loadingPnrs[leg.pnr] = true; });
    renderCards();

    await Promise.all(tripLegs.map(async (leg) => {
      try {
        const data = await fetchPnr(leg.pnr);
        statusCache[leg.pnr] = { success: true, data, lastChecked: new Date().toLocaleTimeString() };
      } catch (err) {
        statusCache[leg.pnr] = { success: false, error: err.message, lastChecked: new Date().toLocaleTimeString() };
      } finally {
        delete loadingPnrs[leg.pnr];
      }
    }));

    localStorage.setItem('status_cache', JSON.stringify(statusCache));
    btn.disabled = false;
    btn.innerHTML = '<span>🔄</span> Check All Status';
    renderCards();
  }

  function getBadge(status) {
    if (!status) return `<span class="status-badge badge-idle">Not Checked</span>`;
    const s = status.toUpperCase();
    if (s.includes('CNF') || s.includes('CONFIRM')) {
      return `<span class="status-badge badge-cnf">${status}</span>`;
    }
    if (s.includes('WL') || s.includes('RAC')) {
      return `<span class="status-badge badge-wl">${status}</span>`;
    }
    return `<span class="status-badge badge-idle">${status}</span>`;
  }

  function renderCards() {
    const container = document.getElementById('pnrContainer');
    if (tripLegs.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 40px;">No trips added.</p>`;
      return;
    }

    container.innerHTML = tripLegs.map((leg, idx) => {
      const cached = statusCache[leg.pnr];
      const isLoading = !!loadingPnrs[leg.pnr];

      let bodyHtml = `
        <div style="display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.85rem; padding: 4px 0;">
          <span>Not checked yet. Click "Check" to inspect booking and train timings.</span>
          <button class="btn-check-single" onclick="refreshSinglePnr(${idx})" ${isLoading ? 'disabled' : ''}>
            ${isLoading ? `<span class="spinning">🔄</span> Checking...` : `<span>🔄</span> Check Status`}
          </button>
        </div>`;

      if (cached) {
        if (!cached.success) {
          bodyHtml = `
            <div class="badge-err" style="padding: 8px 12px; border-radius: 4px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; gap: 8px;">
              <span>Error: ${cached.error}</span>
              <button class="btn-check-single" style="border-color: rgba(239, 68, 68, 0.4); color: #fca5a5;" onclick="refreshSinglePnr(${idx})" ${isLoading ? 'disabled' : ''}>
                ${isLoading ? `<span class="spinning">🔄</span> Checking...` : `<span>🔄</span> Retry`}
              </button>
            </div>`;
        } else {
          const d = cached.data;
          const trainName = d.TrainName || d.trainName || 'Train';
          const trainNo = d.TrainNo || d.trainNumber || '';

          const deptTime = formatTime(d.DepartureTime || d.sourceTime || d.SourceTime);
          const arrTime = formatTime(d.ArrivalTime || d.destinationTime || d.DestinationTime);

          const startDate = extractDate(d);
          const dayCount = d.DayCount || d.dayCount || d.NoOfDays || null;
          const arrivalInfo = computeArrivalDate(startDate, deptTime, arrTime, dayCount);

          const chartPrepared = d.ChartPrepared ? 'Chart Prepared' : 'Chart Not Prepared';
          const passengers = d.PassengerStatus || d.passengers || [];

          const fromCode = d.BoardingPoint || d.From || d.from || '';
          const fromName = d.BoardingStationName || d.FromStationName || d.fromStationName || '';
          const toCode = d.ReservationUpto || d.To || d.to || '';
          const toName = d.ReservationUptoName || d.DestinationStationName || d.destinationStationName || d.ToStationName || '';

          const originDisplay = formatStation(fromCode, fromName);
          const destDisplay = formatStation(toCode, toName);

          bodyHtml = `
            <div class="details-row">
              <div><strong>${trainNo ? `${trainNo} - ` : ''}${trainName}</strong></div>
              <div>📅 <strong>${startDate || 'Date not listed'}</strong> | <span style="color: ${d.ChartPrepared ? 'var(--success)' : 'var(--warning)'}; font-weight: 500;">${chartPrepared}</span></div>
            </div>

            <!-- Start & End Timing Banner with Overnight/Multi-day Handling -->
            <div class="timing-banner">
              <div class="timing-item">
                <span class="timing-label">Boarding / Start</span>
                <span class="timing-val">🕒 ${deptTime}</span>
                <span class="timing-date">📅 ${startDate || '--'}</span>
                <div class="station-display">${originDisplay}</div>
              </div>
              <div style="color: var(--text-muted); font-size: 1.2rem; text-align: center;">➔</div>
              <div class="timing-item" style="text-align: right;">
                <span class="timing-label">Arrival / End</span>
                <span class="timing-val">🕒 ${arrTime}</span>
                <span class="timing-date">
                  📅 ${(arrivalInfo && arrivalInfo.date) || '--'} ${(arrivalInfo && arrivalInfo.tag) ? `<span class="day-badge">${arrivalInfo.tag}</span>` : ''}
                </span>
                <div class="station-display">${destDisplay}</div>
              </div>
            </div>

            ${passengers.length > 0 ? `
              <table class="passenger-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Booking Status</th>
                    <th>Current Status</th>
                    <th>Coach / Berth</th>
                  </tr>
                </thead>
                <tbody>
                  ${passengers.map((p, pIdx) => `
                    <tr>
                      <td>P${pIdx + 1}</td>
                      <td>${p.BookingStatus || '-'}</td>
                      <td>${getBadge(p.CurrentStatus || p.BookingStatus)}</td>
                      <td>${p.Coach ? `${p.Coach} /${p.Berth || ''}` : '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            ` : ''}
          `;
        }
      }

      return `
        <div class="pnr-card">
          <div class="card-head">
            <span class="route-title">${idx + 1}. ${leg.route}</span>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="pnr-tag">${leg.pnr}</span>
              <button class="btn-check-single" onclick="refreshSinglePnr(${idx})" ${isLoading ? 'disabled' : ''} title="Check status for this leg">
                ${isLoading ? `<span class="spinning">🔄</span> Checking...` : `<span>🔄</span> Check`}
              </button>
              <button onclick="removeLeg(${idx})" class="btn-remove" title="Remove leg">✕</button>
            </div>
          </div>
          ${bodyHtml}
          <div class="card-footer">
            <span>Leg ${idx + 1} of ${tripLegs.length}</span>
            <span>${cached ? `Updated: ${cached.lastChecked}` : 'Not checked'}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // Initial render
  renderCards();
</script>

</body>
</html>
